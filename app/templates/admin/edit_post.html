{% extends "admin/layout.html" %}

{% block admin_content %}
<div class="container">

    <h2 class="mb-4">
        <i class="fas fa-edit"></i> Edit Post
    </h2>

    <form method="POST">

        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" class="form-control" value="{{ post.title }}" required>
        </div>

        <div class="form-group">
            <label>Slug</label>
            <input type="text" name="slug" class="form-control" value="{{ post.slug }}" required>
        </div>

        <div class="form-group">
            <label>Content</label>
            <textarea name="content" class="form-control" rows="8" required>{{ post.content }}</textarea>
        </div>

        <div class="form-group">
            <label>Category</label>
            <select name="category" class="form-control">
                <option value="">-- Select Category --</option>
                {% for c in categories %}
                    <option value="{{c.id}}" {% if post.category_id==c.id %}selected{% endif %}>{{c.name}}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Tags (CTRL+Click to select multiple)</label>
            <select name="tags" class="form-control" multiple>
                {% for t in tags %}
                    <option value="{{t.id}}" {% if t in post.tags %}selected{% endif %}>{{t.name}}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-success">
            <i class="fas fa-save"></i> Update Post
        </button>

        <a href="{{ url_for('admin.posts') }}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>
{% endblock %}
