{% extends "admin/layout.html" %}

{% block admin_content %}

<h2>Add Category</h2>

<form method="POST">

<div class="form-group">
<label>Name</label>
<input type="text" name="name" class="form-control" required>
</div>

<div class="form-group">
<label>Slug</label>
<input type="text" name="slug" class="form-control" required>
</div>

<button class="btn btn-primary mt-2">
Add Category
</button>

</form>

{% endblock %}
