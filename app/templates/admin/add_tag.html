{% extends "admin/layout.html" %}

{% block admin_content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-plus"></i> Add New Tag</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="form-group">
                        <label for="name"><strong>Tag Name</strong></label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Enter tag name" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin.tags') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Back
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Add Tag
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
